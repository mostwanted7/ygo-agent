name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      # No EDOPro install, model or WindBot on the runner: the tests that need them skip themselves.
      - name: Test
        run: python -m pytest -q -rs

  windbot:
    name: WindBot fork (mono build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The same command as ./build.sh, in the mono image upstream WindBot builds with.
      - name: Build
        run: |
          if [ ! -f windbot-src/WindBot.csproj ]; then
            echo "::notice::windbot-src is not checked out (no submodule yet); skipping the build"
            exit 0
          fi
          docker run --rm -v "$PWD/windbot-src:/project" -w /project mono:6.12 \
            xbuild /p:Configuration=Release /v:minimal WindBot.csproj
          ls -l windbot-src/bin/Release/WindBot.exe
