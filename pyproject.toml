[build-system]
requires = ["setuptools>=77"]   # PEP 639 license string
build-backend = "setuptools.build_meta"

[project]
name = "ygo-agent"
dynamic = ["version"]
description = "LLM-driven Yu-Gi-Oh! players for EDOPro: play, teach, train and benchmark."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ygo-agent = "ygo_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ygo_agent.__version__" }

[tool.setuptools.packages.find]
include = ["ygo_agent*"]

[tool.setuptools.package-data]
"ygo_agent.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the EDOPro install (~/Games/ProjectIgnis) or other local tools; skipped without them",
    "live: makes real model calls (claude CLI, API keys); skipped unless pytest --live or YGO_AGENT_LIVE=1",
]
