<!doctype html>
<html lang="en" data-theme="dark" data-mode="panel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ygo-agent panel</title>
<!-- data-mode: "panel" (a play/selfplay/teach/coach --web run), or "app" when `ygo-agent web` serves it (shell.js). -->
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a99cff"/><stop offset="1" stop-color="#4cc2ff"/></linearGradient></defs>
      <rect x="6" y="3" width="17" height="24" rx="3" fill="none" stroke="url(#lg)" stroke-width="2.2" transform="rotate(-10 14 15)"/>
      <rect x="10" y="5" width="17" height="24" rx="3" fill="url(#lg)" opacity=".9" transform="rotate(8 18 17)"/>
      <circle cx="18.6" cy="17" r="3.2" fill="#0a0d14"/>
    </svg>
    <span class="name">ygo-agent</span>
  </div>
  <nav id="nav" class="nav hidden" aria-label="App">
    <a href="#/" data-route="home" title="Home"><svg viewBox="0 0 20 20"><path d="M3 9.2 10 3.5l7 5.7V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="#/decks" data-route="decks" title="Decks"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="9" height="12.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 2.8h7.4a2 2 0 0 1 2 2v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Decks</span></a>
    <a href="#/games" data-route="games" title="Games: the board viewer"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 7.6v4.8l4-2.4z" fill="currentColor"/></svg><span>Games</span></a>
    <a href="#/jobs" data-route="jobs" title="Jobs: the commands the app runs"><svg viewBox="0 0 20 20"><path d="M3.5 5.5l3.5 3-3.5 3M9 13.5h7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Jobs</span><b id="nav-jobs" class="nav-count hidden"></b></a>
    <a href="#/setup" data-route="setup" title="Setup"><svg viewBox="0 0 20 20"><path d="M10 6.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zM10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Setup</span></a>
  </nav>
  <button id="game-btn" class="game-btn" title="Games (G)">
    <span id="status-chip" class="chip status idle">NO GAME</span>
    <span id="game-title" class="game-title">Open a game</span>
    <svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div class="spacer"></div>
  <div id="seat-tabs" class="seg hidden"></div>
        <label id="god-toggle" class="switch hidden" title="Reveal both hands and set cards">
    <input type="checkbox" id="god" checked><span class="track"><span class="knob"></span></span><span>God view</span>
  </label>
  <span id="render-err" class="render-err hidden"></span>
  <span id="conn" class="conn" title="Connection"></span>
  <button id="theme-btn" class="icon-btn" title="Light / dark theme">
    <svg viewBox="0 0 20 20"><path d="M10 3.2a6.8 6.8 0 1 0 6.8 6.8A5.3 5.3 0 0 1 10 3.2z" fill="currentColor"/></svg>
  </button>
</header>

<main id="main">
  <section id="board-wrap">
    <div id="board" class="board empty">
      <div class="side opp" id="side-opp"></div>
      <div class="mid" id="mid"></div>
      <div class="side me" id="side-me"></div>
      <svg id="fx" class="fx"></svg>
      <div id="banner" class="banner hidden"></div>
    </div>
    <div id="pausebar" class="pausebar hidden" role="status">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9M11 3.5v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span id="pause-text"></span>
      <button id="pause-live" class="btn primary">Back to live</button><kbd>Esc</kbd>
    </div>
  </section>

  <aside id="side">
    <div class="tabs">
      <button class="tab on" data-tab="stream">Reasoning <span class="count" id="count-stream"></span></button>
      <button class="tab" data-tab="log">Event log <span class="count" id="count-log"></span></button>
      <button class="tab hidden" data-tab="review" id="tab-review" title="The coach's review of the game">Review</button>
      <div class="spacer"></div>
      <label class="switch small" title="Also show automatic decisions (only one choice, planned picks)">
        <input type="checkbox" id="show-auto"><span class="track"><span class="knob"></span></span><span>auto</span>
      </label>
    </div>
    <div id="plan" class="plan hidden"></div>
    <div class="panes">
      <div id="stream" class="pane scroll"></div>
      <div id="log" class="pane scroll hidden"></div>
      <div id="review" class="pane scroll hidden"></div>
      <button id="jump" class="jump hidden">
        <svg viewBox="0 0 16 16"><path d="M8 3v9m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Latest</span></button>
    </div>
    <form id="feedback" class="feedback" autocomplete="off">
      <div class="fb-row">
        <input id="fb-text" type="text" maxlength="2000" placeholder="Note for the coach, e.g. “don't Veiler my Stratos”">
        <button type="submit" id="fb-send" class="btn primary">Save note</button>
      </div>
      <div class="fb-hint" id="fb-hint">Saved to feedback.md like a <code>!note</code> typed in duel chat.</div>
    </form>
  </aside>
</main>

<footer id="timeline">
  <div class="tl-buttons">
    <button class="icon-btn" id="tl-prev-turn" title="Previous turn (Shift+←)"><svg viewBox="0 0 20 20"><path d="M5 4v12M15 4l-7 6 7 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="tl-prev" title="Previous decision (←)"><svg viewBox="0 0 20 20"><path d="M13 4l-7 6 7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn play" id="tl-play" title="Play / pause (Space)"><svg viewBox="0 0 20 20"><path id="play-path" d="M6 4l10 6-10 6z" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="tl-next" title="Next decision (→)"><svg viewBox="0 0 20 20"><path d="M7 4l7 6-7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="tl-next-turn" title="Next turn (Shift+→)"><svg viewBox="0 0 20 20"><path d="M15 4v12M5 4l7 6-7 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="track" class="track-bar"><div id="turns" class="turns"></div><div id="ticks" class="ticks"></div><div id="thumb" class="thumb hidden"></div></div>
  <div id="tl-label" class="tl-label">—</div>
  <button id="live-btn" class="live-btn hidden" title="Follow the live game (L)"><span class="dot"></span>LIVE</button>
</footer>

<section id="page" class="page hidden"></section>

<div id="preview" class="preview hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="toasts" class="toasts"></div>
<script src="/static/app.js"></script>
<script src="/static/shell.js"></script>
</body>
</html>
